name: Update CRAN stats

# Refreshes the versions and download counts on software.html.
# Runs on the 1st of each month, and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

# Needed so the job can push the commit back to the repository.
permissions:
  contents: write

concurrency:
  group: update-cran-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script exits non-zero if any figure could not be fetched, and
      # writes nothing in that case, so a CRAN or cranlogs outage fails the
      # run rather than publishing partial numbers.
      - name: Refresh figures
        run: python scripts/update_cran_stats.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain software.html)" ]; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add software.html
          git commit -m "Update CRAN versions and download counts

          Generated by .github/workflows/update-cran-stats.yml."
          git push
